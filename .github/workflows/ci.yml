name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Check, test, audit, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci || {
            echo "::error::package-lock.json is out of sync with package.json on Linux."
            echo "::error::This typically means the lockfile was last regenerated on a non-Linux host (Windows/macOS) and is missing platform-specific optional dependencies."
            echo "::error::Fix: trigger the 'Refresh package-lock.json on Linux' workflow on this branch (Actions tab → Run workflow, or 'gh workflow run refresh-lockfile.yml --ref ${{ github.ref_name }}'), then re-run this CI check."
            exit 1
          }

      - name: Check
        run: npm run check

      - name: Test
        run: npm run test:run

      - name: Audit dependencies
        run: npm run audit

      - name: Build static site
        run: npm run build
